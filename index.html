<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>聚餐照片上傳 & 抽獎</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>📸 上傳照片參加抽獎</h1>
      <p>上傳一張照片、留下名字和一句話，等等抽獎時就有機會被抽到！</p>
    </div>

    <div class="card">
      <form id="upload-form">
        <label for="photo">照片</label>
        <div class="file-drop" id="file-drop">
          <span class="hint" id="file-hint">點這裡選擇照片（或拍一張新的）</span>
          <input type="file" id="photo" accept="image/*" />
        </div>
        <img id="preview" alt="預覽" />

        <label for="name">名字</label>
        <input type="text" id="name" placeholder="你的名字" maxlength="30" required />

        <label for="message">留一句話（選填）</label>
        <textarea id="message" rows="3" placeholder="說點什麼吧～" maxlength="120"></textarea>

        <button type="submit" id="submit-btn">送出</button>

        <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="msg" id="msg"></div>
      </form>
    </div>

    <p class="footer-hint">上傳的照片會用來進行現場抽獎</p>
  </div>

  <script type="module" src="js/upload.js"></script>
</body>
</html>
