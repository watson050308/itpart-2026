<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抽獎主持畫面</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap admin-wrap">

    <div class="gate" id="gate" style="display:none;">
      <h2>🔒 主持人密碼</h2>
      <input type="password" id="gate-password" placeholder="輸入密碼" />
      <button id="gate-btn">進入</button>
      <p id="gate-error" style="display:none;color:#fca5a5;margin-top:10px;">密碼錯誤</p>
    </div>

    <div id="main" style="display:none;">
      <div class="header">
        <h1>🎊 現場抽獎</h1>
      </div>

      <div class="stat-bar">
        <span class="stat-pill" id="count-pill">目前已上傳 0 張照片</span>
      </div>

      <div class="draw-stage" id="stage"></div>

      <button class="draw-btn" id="draw-btn" disabled>🎲 開始抽獎</button>

      <div class="history">
        <h3>已抽出名單</h3>
        <div class="history-list" id="history-list"></div>
      </div>

      <button id="reset-btn" class="reset-btn">↺ 重設抽獎名單</button>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
